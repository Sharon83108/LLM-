// 固定色序 + 形狀做第二編碼（色盲友善）
const SLOTS = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const SHAPES = ["circle","square","diamond","triangle","triangleDown","hexagon","pentagon","star"];
const OTHER = "其他"; // 超過 8 類時，第 8 類之後併入「其他」（灰色、圓點）
const MODES = {
  provider: { key: "provider",   name: "算力供應商" },
  chip:     { key: "chipVendor", name: "晶片供應商" },
};
let mode = "provider";

const W = 960, H = 460, M = { l: 64, r: 120, t: 20, b: 56 };
const svg = document.getElementById("chart");
const tip = document.getElementById("tip");
const wrap = document.getElementById("wrap");
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const monthIdx = s => { const [y, m] = s.split("-").map(Number); return y * 12 + (m - 1); };
const fmtMonth = i => `${Math.floor(i / 12)}/${(i % 12) + 1}`;

const months = DATA.map(d => monthIdx(d.date));
const xMin = Math.min(...months) - 1, xMax = Math.max(...months) + 1;
const yMax = Math.max(4, Math.ceil((Math.max(...DATA.map(d => d.payback)) + 1) / 2) * 2);
const xStep = Math.max(1, Math.ceil((xMax - xMin) / 8));
const x = i => M.l + (i - xMin) / (xMax - xMin) * (W - M.l - M.r);
const y = v => H - M.b - v / yMax * (H - M.t - M.b);

function shapePath(shape, cx, cy, r) {
  const pts = n => a0 => Array.from({ length: n }, (_, k) => {
    const a = a0 + k * 2 * Math.PI / n;
    return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
  }).join(" ");
  switch (shape) {
    case "square":       return ["rect", { x: cx - r * .85, y: cy - r * .85, width: r * 1.7, height: r * 1.7, rx: 2 }];
    case "diamond":      return ["polygon", { points: pts(4)(-Math.PI / 2).replace(/^/, "") }];
    case "triangle":     return ["polygon", { points: pts(3)(-Math.PI / 2) }];
    case "triangleDown": return ["polygon", { points: pts(3)(Math.PI / 2) }];
    case "hexagon":      return ["polygon", { points: pts(6)(0) }];
    case "pentagon":     return ["polygon", { points: pts(5)(-Math.PI / 2) }];
    case "star": {
      const p = Array.from({ length: 10 }, (_, k) => {
        const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r * 1.1;
        return `${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`;
      }).join(" ");
      return ["polygon", { points: p }];
    }
    default:             return ["circle", { cx, cy, r: r * .9 }];
  }
}
function allCats() {
  const k = MODES[mode].key, seen = [];
  DATA.forEach(d => { if (!seen.includes(d[k])) seen.push(d[k]); });
  return seen;
}
function catOf(d) {
  const c = d[MODES[mode].key], all = allCats();
  return all.length > SLOTS.length && all.indexOf(c) >= SLOTS.length - 1 ? OTHER : c;
}
function categories() {
  const seen = [];
  DATA.forEach(d => { const c = catOf(d); if (!seen.includes(c)) seen.push(c); });
  return seen;
}
function styleOf(cat) {
  if (cat === OTHER) return { color: "var(--s9)", shape: "circle" };
  const i = categories().indexOf(cat);
  return { color: `var(${SLOTS[i]})`, shape: SHAPES[i] };
}
function miniMarker(cat, size = 14) {
  const s = styleOf(cat);
  const m = document.createElementNS(NS, "svg");
  m.setAttribute("width", size); m.setAttribute("height", size);
  m.setAttribute("viewBox", `0 0 ${size} ${size}`);
  const [tag, a] = shapePath(s.shape, size / 2, size / 2, size / 2 - 1);
  el(tag, { ...a, fill: s.color }, m);
  return m;
}

function render() {
  svg.innerHTML = "";
  const k = MODES[mode].key;
  document.getElementById("chartTitle").textContent = `建置成本回收期 × 消息時間（依${MODES[mode].name}）`;

  // grid + y axis
  const gy = el("g", { class: "tick" }, svg);
  for (let v = 0; v <= yMax; v += 2) {
    el("line", { x1: M.l, x2: W - M.r, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, gy);
    const t = el("text", { x: M.l - 10, y: y(v) + 4, "text-anchor": "end" }, gy);
    t.textContent = v;
  }
  // x axis
  const gx = el("g", { class: "tick" }, svg);
  for (let i = xMin + 1; i <= xMax; i += xStep) {
    el("line", { x1: x(i), x2: x(i), y1: H - M.b, y2: H - M.b + 5, stroke: "var(--axis)" }, gx);
    const t = el("text", { x: x(i), y: H - M.b + 20, "text-anchor": "middle" }, gx);
    t.textContent = fmtMonth(i);
  }
  el("text", { class: "axis-title", x: (M.l + W - M.r) / 2, y: H - 10, "text-anchor": "middle" }, svg).textContent = "消息時間";
  el("text", { class: "axis-title", transform: `translate(18 ${(M.t + H - M.b) / 2}) rotate(-90)`, "text-anchor": "middle" }, svg).textContent = "建置回本期（年）";

  // points
  const gp = el("g", { id: "points" }, svg);
  const pts = [];
  DATA.forEach((d, idx) => {
    const s = styleOf(catOf(d));
    const cx = x(monthIdx(d.date)), cy = y(d.payback);
    const g = el("g", { class: "mark-g", "data-cat": catOf(d), tabindex: 0 }, gp);
    el("circle", { cx, cy, r: 18, fill: "transparent" }, g); // hit area
    const [tag, a] = shapePath(s.shape, cx, cy, 8);
    el(tag, { ...a, class: "mark", fill: s.color }, g);
    pts.push({ d, cx, cy, cat: catOf(d), g });
    g.addEventListener("mouseenter", () => { showTip(d, cx, cy); peekLabel(idx, true); });
    g.addEventListener("focus", () => { showTip(d, cx, cy); peekLabel(idx, true); });
    g.addEventListener("mouseleave", () => { hideTip(); peekLabel(idx, false); });
    g.addEventListener("blur", () => { hideTip(); peekLabel(idx, false); });
  });
  placeLabels(pts);

  // legend
  const lg = document.getElementById("legend");
  lg.innerHTML = "";
  categories().forEach(c => {
    const n = DATA.filter(d => catOf(d) === c).length;
    const sp = document.createElement("span");
    sp.appendChild(miniMarker(c));
    sp.appendChild(document.createTextNode(`${c}（${n}）`));
    sp.addEventListener("mouseenter", () => highlight(c));
    sp.addEventListener("mouseleave", () => highlight(null));
    lg.appendChild(sp);
  });
}

// 標籤避讓：依序嘗試 8 個方位，挑第一個不撞到其他標籤、數據點、且不超出繪圖區的位置；
// 都放不下就隱藏（滑鼠移到點上或圖例時再顯示）。新消息優先擺放。
function placeLabels(pts) {
  const gl = el("g", { id: "labels" }, svg);
  const PAD = 3, R = 10, GAP = 13;
  const boxes = pts.map(p => ({ x: p.cx - R, y: p.cy - R, w: 2 * R, h: 2 * R })); // 數據點佔位
  const hit = (a, b) => a.x < b.x + b.w + PAD && b.x < a.x + a.w + PAD && a.y < b.y + b.h + PAD && b.y < a.y + a.h + PAD;
  const inside = b => b.x >= M.l && b.x + b.w <= W - 4 && b.y >= 0 && b.y + b.h <= H - M.b;
  const order = pts.map((p, i) => i).sort((a, b) => monthIdx(pts[b].d.date) - monthIdx(pts[a].d.date) || a - b);
  order.forEach(i => {
    const p = pts[i];
    const lbl = el("text", { class: "pt-label", "data-idx": i, "data-cat": p.cat }, gl);
    lbl.textContent = p.d.provider + " ";
    el("tspan", { class: "v" }, lbl).textContent = p.d.payback + "年";
    const bb = lbl.getBBox(), w = bb.width, h = bb.height;
    // [anchor, dx, dy]：右、左、上、下、右上、右下、左上、左下
    const cands = [
      ["start", GAP, 4], ["end", -GAP, 4], ["middle", 0, -GAP - 2], ["middle", 0, GAP + 10],
      ["start", GAP - 4, -GAP + 2], ["start", GAP - 4, GAP + 6], ["end", -GAP + 4, -GAP + 2], ["end", -GAP + 4, GAP + 6],
    ];
    let placed = false;
    for (const [anc, dx, dy] of cands) {
      const lx = p.cx + dx, ly = p.cy + dy;
      const bx = anc === "start" ? lx : anc === "end" ? lx - w : lx - w / 2;
      const box = { x: bx, y: ly - h * 0.8, w, h };
      if (!inside(box) || boxes.some((b, j) => j !== i && hit(box, b))) continue;
      lbl.setAttribute("x", lx); lbl.setAttribute("y", ly); lbl.setAttribute("text-anchor", anc);
      boxes.push(box); placed = true; break;
    }
    if (!placed) {
      lbl.setAttribute("x", p.cx + GAP); lbl.setAttribute("y", p.cy + 4);
      if (p.cx + GAP + w > W - 4) { lbl.setAttribute("x", p.cx - GAP); lbl.setAttribute("text-anchor", "end"); }
      lbl.classList.add("hidden");
    }
  });
}
function peekLabel(idx, on) {
  const l = svg.querySelector(`.pt-label[data-idx="${idx}"]`);
  if (l) l.classList.toggle("peek", on);
}

function highlight(cat) {
  svg.classList.toggle("dim", !!cat);
  svg.querySelectorAll(".mark-g, .pt-label").forEach(g => g.classList.toggle("active", g.dataset.cat === cat));
}

function showTip(d, cx, cy) {
  const k = MODES[mode].key;
  tip.innerHTML = "";
  const t = document.createElement("div"); t.className = "t";
  t.appendChild(miniMarker(catOf(d), 12));
  t.appendChild(document.createTextNode(`${d.tenant} × ${d.provider}`));
  tip.appendChild(t);
  const dl = document.createElement("dl");
  [["消息時間", d.date.replace("-", "/")], ["建置回本期", d.payback + " 年", true], ["晶片供應商", d.chipVendor],
   ["採用晶片", d.chip], ["年期", d.term], ["運算容量", d.cap], ["合約金額", d.amount],
   ["1GW 對應營收", d.rev], ["1GW 建造成本", d.cost]].forEach(([a, b, hl]) => {
    const dt = document.createElement("dt"); dt.textContent = a;
    const dd = document.createElement("dd"); dd.textContent = b; if (hl) dd.className = "hl";
    dl.append(dt, dd);
  });
  tip.appendChild(dl);
  const r = svg.getBoundingClientRect(), sc = r.width / W;
  let left = cx * sc + 16, top = cy * sc - 20;
  tip.style.opacity = 1;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (left + tw > r.width) left = cx * sc - tw - 16;
  if (left < 0) left = 4;
  if (top + th > r.height) top = r.height - th;
  if (top < 0) top = 0;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip() { tip.style.opacity = 0; }

function renderTable() {
  const tb = document.getElementById("tbody");
  DATA.forEach(d => {
    const tr = document.createElement("tr");
    const cells = [d.no, d.date.replace("-", "/"), d.tenant, d.provider, d.chipVendor, d.chip, d.term, d.cap, d.amount, d.rev, d.cost, d.payback + " 年"];
    cells.forEach((c, i) => {
      const td = document.createElement("td"); td.textContent = c;
      if (i >= 6) td.className = "num";
      tr.appendChild(td);
    });
    const td = document.createElement("td");
    d.src.forEach((s, i) => {
      if (i) td.appendChild(document.createElement("br"));
      if (s.startsWith("http")) {
        const a = document.createElement("a"); a.href = s; a.target = "_blank"; a.rel = "noopener";
        a.textContent = new URL(s).hostname; td.appendChild(a);
      } else td.appendChild(document.createTextNode(s));
    });
    tr.appendChild(td);
    tb.appendChild(tr);
  });
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  hideTip(); render();
}));
render(); renderTable();
</script>
